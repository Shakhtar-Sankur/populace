# Populace has 20 self-tests and, until now, nothing that ran them. A test suite
# nobody runs is documentation.
#
# The demo is part of CI on purpose: it exercises the whole product end to end —
# config, adapter loading, the world, instrumentation, teardown and both report
# formats — against a fake app with a known bug in it. If Populace ever stops
# finding that bug, this build fails, which is the one regression that would
# matter most.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines; 22 is what most
        # people are actually on. Both must work.
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step, and that is the point: the engine has zero runtime
      # dependencies. If this ever needs `npm ci` to pass, that claim is broken.
      - name: Self-tests
        run: node src/selftest.mjs

      - name: Demo run against the bundled fake app
        # The demo app has a deliberate RLS bug, so a clean exit code is the
        # failure case here: it would mean Populace stopped reporting failures.
        run: |
          if node src/cli.mjs demo; then
            echo "::error::The demo exited 0. The demo app has a known bug, so Populace should have found it and exited non-zero."
            exit 1
          fi
          echo "Populace correctly found the demo app's bug and exited non-zero."

      - name: The report is written, and is self-contained
        run: |
          test -f populace-report.json || { echo "::error::No JSON report"; exit 1; }
          test -f populace-report.html || { echo "::error::No HTML report"; exit 1; }
          if grep -qiE '<script|https?://[^"]*\.(js|css)' populace-report.html; then
            echo "::error::The HTML report pulled in a script or a remote asset. It must stay self-contained."
            exit 1
          fi
          echo "Both reports written; the HTML has no scripts and fetches nothing."

      - name: A fresh scaffold refuses to run, and says why in a sentence
        # `init` used to emit a stub whose methods threw, so this step asserted
        # "2/13 and stops". It now scaffolds the working REST template, so the
        # refusal comes from the target being unset instead — and for a while
        # that surfaced as a raw TypeError:
        #   Cannot read properties of undefined (reading 'replace')
        # Still a non-zero exit, so this step stayed green while a newcomer's
        # first command printed a JS stack trace. Exit codes alone were not
        # enough; the message is asserted now too.
        run: |
          mkdir -p /tmp/scaffold && cd /tmp/scaffold
          node "$GITHUB_WORKSPACE/src/cli.mjs" init
          if node "$GITHUB_WORKSPACE/src/cli.mjs" doctor > out.txt 2>&1; then
            cat out.txt
            echo "::error::doctor exited 0 on a scaffold with no target. It must refuse."
            exit 1
          fi
          cat out.txt
          if grep -qiE "Cannot read propert|undefined \(reading|TypeError" out.txt; then
            echo "::error::doctor refused with an internal error rather than an explanation."
            exit 1
          fi
          grep -qi "No target URL" out.txt || {
            echo "::error::doctor refused, but not with the expected guidance."
            exit 1
          }
          echo "A fresh scaffold refuses, and explains itself."

      - name: The scaffolded adapter is the working one
        # init's whole purpose changed: it must hand over code that runs, not a
        # file full of throws. If someone reverts it to the stub, this fails.
        run: |
          cd /tmp/scaffold
          grep -q "createUser not implemented" adapters/my-app.mjs && {
            echo "::error::init scaffolded the stub. It should scaffold the REST template."
            exit 1
          }
          grep -q "auth/signup" adapters/my-app.mjs || {
            echo "::error::the scaffolded adapter does not look like the REST template."
            exit 1
          }
          echo "init scaffolded the working template."

      - name: The Action's summary handles every verdict, including no report
        # github-summary.mjs runs with `if: always()` after a run that may have
        # died. If it throws, it replaces the real failure with a confusing one,
        # so the missing-report path is asserted rather than assumed.
        run: |
          export GITHUB_OUTPUT=/tmp/gh_out
          export GITHUB_STEP_SUMMARY=/tmp/gh_sum
          : > "$GITHUB_OUTPUT"
          : > "$GITHUB_STEP_SUMMARY"

          POPULACE_REPORT=populace-report.json node src/github-summary.mjs
          grep -q "^verdict<<" "$GITHUB_OUTPUT" || {
            echo "::error::No verdict output was emitted."; exit 1; }
          grep -q "API calls" "$GITHUB_STEP_SUMMARY" || {
            echo "::error::The job summary has no headline."; exit 1; }
          grep -q "| Method | Calls |" "$GITHUB_STEP_SUMMARY" || {
            echo "::error::The job summary has no per-method table."; exit 1; }

          if ! POPULACE_REPORT=/tmp/does-not-exist.json node src/github-summary.mjs; then
            echo "::error::The summary threw on a missing report. It runs with if:always() and must not."
            exit 1
          fi
          grep -q "no-report" "$GITHUB_OUTPUT" || {
            echo "::error::A missing report did not produce the no-report verdict."; exit 1; }
          echo "The Action's summary handles a real report and a missing one."

      - name: action.yml is well formed and passes inputs through env
        # A workflow input is attacker-controllable on a fork PR. Interpolating
        # one into a run block is a shell injection; this refuses that.
        run: node .github/check-action.mjs
