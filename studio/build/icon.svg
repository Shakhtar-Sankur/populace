<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Gigzen Populace — the desktop application icon.

    This replaces the lime-on-charcoal grid. Two things changed and both were
    deliberate:

    1. INDIGO. #4F46E5 is Gigzen's colour, and both products now use it. The
       lime was this product's own, which made the two Gigzen applications look
       like they came from different companies.

    2. THE MARK IS NOW THE BRAND MARK. It used to be a loose nine-dot grid with
       one dot under a progress ring — a good drawing, but nothing else in the
       product used it, so it was an icon rather than an identity. This is the
       same ring of six that the website and the favicon use: six agents,
       because a run uses six simulated people, and the last one hollow,
       because the run that made this product's reputation had one user whose
       profile was never created.

    Geometry note: centres sit on a radius-120 circle and the dots are r=53.6,
    so adjacent dots leave a 12.8px gap at 512. That gap survives down to a
    16x16 favicon as a visible texture; any tighter and the ring fills in and
    reads as a solid blob.

    Flat fills, no gradient on the dots: this is rasterised to a 16px .ico and a
    gradient at that size is noise that costs sharpness.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset=".55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none"
        stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3"/>

  <!-- five agents that exist -->
  <g fill="#FFFFFF">
    <circle cx="256"    cy="136" r="53.6"/>
    <circle cx="152.08" cy="196" r="53.6"/>
    <circle cx="152.08" cy="316" r="53.6"/>
    <circle cx="256"    cy="376" r="53.6"/>
    <circle cx="359.92" cy="316" r="53.6"/>
  </g>

  <!-- and the one that never got created -->
  <circle cx="359.92" cy="196" r="44.8" fill="none" stroke="#FFFFFF" stroke-width="17.6"/>
</svg>
